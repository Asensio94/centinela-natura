name: Diagnóstico de red
on: workflow_dispatch
permissions: {}
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Catastro
        run: |
          set +e
          for u in \
            "https://ovc.catastro.meh.es/INSPIRE/wfsCP.aspx?service=WFS&version=2.0.0&request=GetCapabilities" \
            "http://ovc.catastro.meh.es/INSPIRE/wfsCP.aspx?service=WFS&version=2.0.0&request=GetCapabilities" \
            "https://www.catastro.hacienda.gob.es/INSPIRE/CadastralParcels/ES.SDGC.CP.atom.xml" \
            "http://www.catastro.minhap.es/INSPIRE/CadastralParcels/ES.SDGC.CP.atom.xml" \
            "https://www1.sedecatastro.gob.es/Cartografia/mapa.aspx?refcat=39013A00700281" \
            "https://www.boe.es/"; do
            curl -sS -o /tmp/r -w "%{http_code} %{size_download}B %{time_total}s" --max-time 30 "$u"; echo "  rc=$?  $u"
          done
          curl -v --max-time 20 -o /dev/null "https://ovc.catastro.meh.es/INSPIRE/wfsCP.aspx" 2>&1 | grep -E "^\*" | head -25
