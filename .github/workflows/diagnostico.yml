name: Diagnóstico de red
on: workflow_dispatch
permissions: {}
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Catastro WFS por caja
        run: |
          set +e
          U="https://ovc.catastro.meh.es/INSPIRE/wfsCP.aspx?service=WFS&version=2.0.0&request=GetFeature&typeNames=CP:CadastralParcel&srsName=EPSG::25830&bbox=376000,4778000,376500,4778500"
          for i in 1 2 3; do
            curl -sS -o /tmp/r -w "%{http_code} %{size_download}B %{time_total}s" --max-time 60 "$U"; echo "  rc=$?"
            head -c 200 /tmp/r 2>/dev/null; echo
          done
          curl -sS -o /tmp/r -w "%{http_code} %{size_download}B %{time_total}s" --http1.1 --max-time 60 -A "Mozilla/5.0" "$U"; echo "  rc=$? http1.1+UA"
          curl -v --max-time 60 -o /dev/null "$U" 2>&1 | grep -E "^[<*] (HTTP|Recv|Connection|Closing|OpenSSL|TLS.*alert)|curl:" | head -20
